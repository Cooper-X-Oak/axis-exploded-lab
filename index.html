<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Axis Exploded Lab</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <main class="app">
      <section class="viewport">
        <canvas id="scene"></canvas>
        <div class="hud" id="hud">
          <strong>axis-exploded-lab</strong>
          <span id="status">loading</span>
        </div>
      </section>
      <aside class="panel">
        <header>
          <h1>Axis Animation Rig Lab</h1>
          <p id="summary">读取轴线式装配动画控制台</p>
        </header>

        <div class="control-row">
          <label for="view-mode">视图</label>
          <select id="view-mode">
            <option value="assembled">装配态</option>
            <option value="hero-exploded">轴线爆炸</option>
            <option value="exploded">零件族参考</option>
          </select>
        </div>

        <div class="buttons view-actions">
          <button id="reset-assembly" type="button">复位</button>
          <button id="hold-hero-exploded" type="button">轴线爆炸</button>
          <button id="hold-exploded" type="button">族参考</button>
          <button id="play-explode" type="button">播放</button>
        </div>

        <div class="slider">
          <label for="explode-progress">展开 <span id="explode-value">0%</span></label>
          <input id="explode-progress" type="range" min="0" max="1" step="0.01" value="0" />
        </div>

        <div class="slider">
          <label for="axis-x-scale">X 流道横轴 <span id="axis-x-value">1.00</span></label>
          <input id="axis-x-scale" type="range" min="0.25" max="1.8" step="0.05" value="1" />
        </div>
        <div class="slider">
          <label for="axis-z-scale">Y 阀杆竖轴 <span id="axis-z-value">0.75</span></label>
          <input id="axis-z-scale" type="range" min="0.15" max="1.6" step="0.05" value="0.75" />
        </div>
        <div class="slider">
          <label for="axis-y-scale">Z 深度错层 <span id="axis-y-value">0.12</span></label>
          <input id="axis-y-scale" type="range" min="0" max="0.55" step="0.01" value="0.12" />
        </div>
        <div class="slider">
          <label for="axis-spacing-scale">间距 <span id="axis-spacing-value">1.00</span></label>
          <input id="axis-spacing-scale" type="range" min="0.55" max="1.8" step="0.05" value="1" />
        </div>

        <div class="buttons">
          <button id="show-all" type="button">全部零件</button>
          <button id="fit-view" type="button">适配</button>
          <button id="copy-state" type="button">复制状态</button>
        </div>

        <div class="slider">
          <label for="light-strength">灯光 <span id="light-value">1.00</span></label>
          <input id="light-strength" type="range" min="0.2" max="2.2" step="0.05" value="1" />
        </div>
        <h2>零件族</h2>
        <div class="roles" id="roles"></div>

        <h2>Rig 状态</h2>
        <pre id="gate-log"></pre>
      </aside>
    </main>
    <script type="module" src="./src/app.js?v=animation-lab-2"></script>
  </body>
</html>
